apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [demo]
      validate:
        message: "Using ':latest' or untagged images is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"
