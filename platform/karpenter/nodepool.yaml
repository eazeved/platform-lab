# EKS only. Karpenter controller is installed by infra/modules/eks.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [arm64, amd64]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, t]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 168h
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-platform-lab-dev
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: platform-lab-dev}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: platform-lab-dev}
