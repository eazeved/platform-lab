name: ci
on:
  push:
    branches: [main]
    paths: ["apps/demo/**", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["apps/demo/**"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/demo

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/demo}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache-dependency-path: apps/demo/go.sum}
      - run: go mod tidy && git diff --exit-code go.mod
      - run: go vet ./...
      - run: go test ./... -race -cover

  build-sign:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/demo
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign and attest
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
