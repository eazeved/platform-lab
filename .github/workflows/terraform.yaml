name: terraform
on:
  pull_request:
    paths: ["infra/**"]
  schedule:
    - cron: "0 9 * * 1"   # weekly drift detection (enable after AWS OIDC is set up)

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [vpc, eks, budget, github-oidc]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/modules/${{ matrix.module }}
      - if: matrix.module == 'vpc'
        run: terraform test
        working-directory: infra/modules/vpc
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/modules/${{ matrix.module }}
          soft_fail: true

