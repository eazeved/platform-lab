{{- if and .Values.rollout.enabled (.Capabilities.APIVersions.Has "argoproj.io/v1alpha1/Rollout") }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  labels: {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "demo.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "demo.labels" . | nindent 8 }}
    spec: {{- include "demo.podSpec" . | nindent 6 }}
  strategy:
    canary:
      steps: {{- toYaml .Values.rollout.steps | nindent 8 }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: demo-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] >= 0.99
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{job="demo",code!~"5.."}[1m]))
            / clamp_min(sum(rate(http_requests_total{job="demo"}[1m])), 1e-9)
{{- end }}
